services:
  redis:
    image: redis/redis-stack:latest
    container_name: analytics-core-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: analytics-core-mysql
    environment:
      MYSQL_ROOT_PASSWORD: analytics_core_root
      MYSQL_DATABASE: analytics_core
      MYSQL_USER: analytics_core
      MYSQL_PASSWORD: analytics_core
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uanalytics_core -panalytics_core --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: analytics-core-clickhouse
    environment:
      CLICKHOUSE_DB: analytics_core
      CLICKHOUSE_USER: analytics_core
      CLICKHOUSE_PASSWORD: analytics_core
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  clickhouse-data:
